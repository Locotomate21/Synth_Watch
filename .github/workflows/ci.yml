name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only first-party actions are used here. uv is the recommended way to work on
# this project locally, but a third-party action is one more thing that can
# break the build for reasons that have nothing to do with the code; pip reads
# the same PEP 621 metadata.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -m "not network" --cov --cov-report=term-missing
